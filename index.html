<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Rating Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
  </head>
  <body>
    <main>
      <section class="rate-us">
        <div class="container">
          <div class="rating-component">
            <div class="rating-component__content">
              <div class="rating-component__icon" aria-hidden="true">
                <svg width="17" height="16" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="m9.067.43 1.99 4.031c.112.228.33.386.58.422l4.45.647a.772.772 0 0 1 .427 1.316l-3.22 3.138a.773.773 0 0 0-.222.683l.76 4.431a.772.772 0 0 1-1.12.813l-3.98-2.092a.773.773 0 0 0-.718 0l-3.98 2.092a.772.772 0 0 1-1.119-.813l.76-4.431a.77.77 0 0 0-.222-.683L.233 6.846A.772.772 0 0 1 .661 5.53l4.449-.647a.772.772 0 0 0 .58-.422L7.68.43a.774.774 0 0 1 1.387 0Z"
                    fill="#FC7614"
                  />
                </svg>
              </div>
              <div class="rating-component__text">
                <h1>How did we do?</h1>
                <p>
                  Please let us know how we did with your support request. All
                  feedback is appreciated to help us improve our offering!
                </p>
                <div class="rating-component__rating-buttons">
                  <button class="btn--rating" type="button" data-rating="1">
                    1
                  </button>
                  <button class="btn--rating" type="button" data-rating="2">
                    2
                  </button>
                  <button class="btn--rating" type="button" data-rating="3">
                    3
                  </button>
                  <button class="btn--rating" type="button" data-rating="4">
                    4
                  </button>
                  <button class="btn--rating" type="button" data-rating="5">
                    5
                  </button>
                </div>
              </div>
              <div class="submit-container">
                <button class="btn" type="submit">Submit</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --colors-white: #ffffff;
        --colors-black: #000000;
        --colors-orange-500: #fc7614;
        --colors-grey-500: #969fad;
        --colors-grey-900: #262e38;
        --colors-grey-950: #131518;
        --colors-gradient-1: radial-gradient(
          98.96% 98.96% at 50% 0%,
          #232a34 0%,
          #181e27 100%
        );
      }

      html,
      body {
        min-width: 100vw;
        min-height: 100vh;
      }

      body {
        align-items: center;
        background-color: var(--colors-grey-950);
        color: var(--colors-grey-500);
        display: flex;
        font-family: "Overpass", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-weight: 400;
        justify-content: center;
        line-height: 1.6;
      }

      h1 {
        color: var(--colors-white);
        font-size: clamp(1.5rem, 1.412rem + 0.3756vw, 1.75rem);
        font-weight: 700;
        line-height: 1.25;
      }

      p {
        font-size: clamp(0.875rem, 0.853rem + 0.0939vw, 0.9375rem);
        max-width: 32ch;
      }

      button {
        font-family: inherit;
      }

      .container {
        margin-inline: auto;
        max-width: 1240px;
        width: 90%;
      }

      .submit-container {
        align-self: stretch;
      }

      .btn {
        align-items: center;
        background: var(--colors-orange-500);
        border: none;
        border-radius: 22.5px;
        color: var(--colors-grey-950);
        display: inline-flex;
        font-weight: 700;
        font-size: 0.875rem;
        justify-content: center;
        padding-block: 1rem;
        text-transform: uppercase;
        width: 100%;
      }

      .btn--rating {
        align-items: center;
        background: var(--colors-grey-900);
        border: none;
        border-radius: 21px;
        color: inherit;
        display: inline-flex;
        font-size: clamp(0.875rem, 0.831rem + 0.1878vw, 1rem);
        font-weight: 700;
        gap: 0.5rem;
        height: clamp(2.625rem, 2.4269rem + 0.8451vw, 3.1875rem);
        justify-content: center;
        letter-spacing: 1.87px;
        line-height: 1.28571;
        padding: clamp(0.5rem, 0.3239rem + 0.7512vw, 1rem)
          clamp(1rem, 0.8239rem + 0.7512vw, 1.5rem);
        text-align: center;
        width: clamp(2.625rem, 2.4269rem + 0.8451vw, 3.1875rem);
      }

      .rate-us > .container {
        align-items: center;
        display: flex;
        justify-content: center;
      }

      .rating-component {
        align-items: center;
        background: var(--colors-gradient-1);
        border-radius: 30px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      .rating-component__content {
        align-items: flex-start;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .rating-component__icon {
        align-items: center;
        background: var(--colors-grey-900);
        border-radius: 24px;
        display: flex;
        justify-content: center;
        padding: 1rem;
      }

      .rating-component__text {
        align-items: flex-start;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .rating-component__rating-buttons {
        align-items: center;
        display: flex;
        gap: 1.5rem;
        justify-content: center;
      }

      @media (min-width: 768px) {
        p {
          max-width: 35ch;
        }

        .btn {
          font-weight: 600;
        }
        .btn--rating {
          border-radius: 25.5px;
          gap: 1rem;
          height: 51px;
          letter-spacing: 0.2px;
          line-height: 1.5;
          width: 51px;
        }
      }
    </style>
  </body>
</html>
